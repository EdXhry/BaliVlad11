[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bali-events-aggregator"
version = "0.1.0"
description = "Automatic Bali events aggregator and Telegram publisher"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Bali Events Team", email = "team@example.com"},
]
keywords = ["telegram", "events", "aggregator", "bali", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    # Web scraping and HTTP
    "httpx[socks]==0.27.0",
    "beautifulsoup4==4.12.3",
    "playwright>=1.45.0",
    "lxml==5.2.2",
    
    # Telegram integration
    "python-telegram-bot==21.6",
    
    # Web framework and API
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    
    # Database and ORM
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    
    # Data validation and configuration
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "pyyaml==6.0.1",
    
    # Task scheduling
    "apscheduler==3.10.4",
    
    # Logging
    "structlog==24.4.0",
    
    # Retry logic
    "tenacity==9.0.0",
    
    # Utilities
    "python-dotenv==1.0.1",
    "fake-useragent==1.5.1",
    "jinja2==3.1.4",
]

[project.optional-dependencies]
dev = [
    "black==24.4.2",
    "flake8==7.0.0",
    "mypy==1.10.0",
    "isort==5.13.2",
    "hypothesis==6.102.11",
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "pre-commit==3.7.0",
]

[project.urls]
Homepage = "https://github.com/example/bali-events-aggregator"
Repository = "https://github.com/example/bali-events-aggregator.git"
Issues = "https://github.com/example/bali-events-aggregator/issues"
Documentation = "https://github.com/example/bali-events-aggregator/wiki"

[project.scripts]
bali-events = "main:main"
bali-collect = "main:run_collection"
bali-publish = "main:run_publication"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "property: property-based tests",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true